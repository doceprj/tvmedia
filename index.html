<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easton Park - Lite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

    /* Video tetap full screen */
    #video-slot {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
    }

    /* Container bawah */
    .footer {
      position: fixed; bottom: 20px; left: 20px; right: 20px;
      display: flex; gap: 10px; align-items: center;
    }

    /* Ticker Ringan */
    .ticker-box {
      flex: 1; height: 40px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: flex; align-items: center;
    }

    .ticker-content {
      white-space: nowrap;
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
      /* Animasi linear yang lebih ringan */
      animation: move-text 15s linear infinite;
      padding-left: 100%;
    }

    @keyframes move-text {
      from { transform: translateX(0); }
      to { transform: translateX(-150%); } /* Sesuaikan agar teks benar-benar hilang */
    }

    /* Jam */
    .clock {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 0 20px; height: 40px;
      border-radius: 20px;
      color: #fff; font-family: monospace;
      display: flex; align-items: center;
      font-weight: bold; font-size: 1.1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body onclick="playVideo()">

  <video id="video-slot" muted playsinline loop></video>

  <div class="footer">
    <div class="ticker-box">
      <div class="ticker-content">
        SELAMAT DATANG DI EASTON PARK RESIDENCE JATINANGOR - KENYAMANAN HUNIAN APARTEMEN TERBAIK
      </div>
    </div>
    <div id="clock" class="clock">00:00:00</div>
  </div>

<script>
  const v = document.getElementById('video-slot');
  v.src = "https://github.com/doceprj/tvmedia/raw/refs/heads/main/tvmediaa.mp4";

  function playVideo() {
    v.play();
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
  }

  // Update Jam 1 detik sekali
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID', { hour12: false });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Auto Refresh jika ada perubahan file (Interval dinaikkan ke 10 detik agar hemat resource)
  let lastModified = "";
  setInterval(() => {
    fetch(window.location.href, { method: 'HEAD' }).then(res => {
      let current = res.headers.get("Last-Modified");
      if (lastModified && current !== lastModified) location.reload();
      lastModified = current;
    }).catch(e => console.log("Check failed"));
  }, 10000);
</script>
</body>
</html>
