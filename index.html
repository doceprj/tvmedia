<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easton Park - Color Balanced</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }

    #video-slot {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
    }

    .footer-bar {
      position: fixed; 
      bottom: 4vh; 
      left: 3vw; 
      right: 3vw;
      height: 7.5vh; 
      display: flex; 
      gap: 1.5vw;
    }

    /* BOX TEKS: Pakai Abu Gelap Pekat (Bukan Hitam Total) */
    /* Ini supaya di TV tidak "tenggelam" kalau layarnya tipe VA */
    .ticker-box {
      flex: 1; 
      overflow: hidden; 
      display: flex; 
      align-items: center;
      background: #1c1c1c; 
      border-radius: 50px; 
      border: 2px solid #444; /* Border netral */
    }

    .ticker-content {
      white-space: nowrap; 
      color: #FFFFFF; /* Putih bersih, paling aman di TV */
      font-weight: 700; 
      font-size: 3.5vh; 
      letter-spacing: 0.5px;
      will-change: transform;
      animation: move-text 35s linear infinite; 
    }

    @keyframes move-text {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-120%); }
    }

    /* BOX JAM: Pakai warna Hijau Mint yang lebih 'Deep' */
    /* Warna ini biasanya terlihat sama di hampir semua jenis layar TV */
    .clock-box {
      background: #00f2ad; /* Hijau Mint Standar Digital Signage */
      color: #002e21; /* Font hijau sangat gelap agar kontras tajam */
      padding: 0 4vw;
      display: flex; 
      align-items: center; 
      font-family: 'Courier New', monospace;
      font-weight: 900; 
      font-size: 4vh; 
      border-radius: 50px;
      min-width: 18vw; 
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); /* Shadow agar jam "keluar" dari background video */
    }
  </style>
</head>
<body onclick="playVideo()">

  <video id="video-slot" muted playsinline loop></video>

  <div class="footer-bar">
    <div class="ticker-box">
      <div class="ticker-content">
        EASTON PARK RESIDENCE JATINANGOR
      </div>
    </div>
    <div id="clock" class="clock-box">00:00:00</div>
  </div>

<script>
  const v = document.getElementById('video-slot');
  const VIDEO_URL = "https://github.com/doceprj/tvmedia/raw/refs/heads/main/tvmediaa.mp4";

  function playVideo() {
    if (!v.src) v.src = VIDEO_URL;
    v.play();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  function updateClock() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    const s = String(d.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // REFRESH OTOMATIS (Bypass Cache)
  let lastUpdate = "";
  setInterval(() => {
    fetch(window.location.href + "?check=" + Date.now(), { 
      method: 'HEAD', 
      cache: 'no-store' 
    })
    .then(res => {
      const current = res.headers.get("ETag") || res.headers.get("Last-Modified");
      if (lastUpdate && current && current !== lastUpdate) {
        window.location.reload(true);
      }
      lastUpdate = current;
    }).catch(() => {});
  }, 10000);

  window.onload = () => { 
    v.src = VIDEO_URL; 
    v.play().catch(() => {}); 
  };
</script>
</body>
</html>
