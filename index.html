<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easton Park - Rounded Auto Refresh</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: sans-serif; }

    #video-slot {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
    }

    .footer-bar {
      position: fixed; bottom: 15px; left: 15px; right: 15px;
      height: 50px; display: flex; gap: 10px;
    }

    .ticker-box {
      flex: 1; overflow: hidden; display: flex; align-items: center;
      background: #000; border-radius: 25px; border: 2px solid #77E477;
    }

    .ticker-content {
      white-space: nowrap; color: #fff; font-weight: 800; font-size: 18px;
      will-change: transform;
      animation: move-text 15s linear infinite;
    }

    @keyframes move-text {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    .clock-box {
      background: #77E477; color: #000; padding: 0 25px;
      display: flex; align-items: center; font-family: monospace;
      font-weight: bold; font-size: 20px; border-radius: 25px;
      min-width: 130px; justify-content: center;
    }
  </style>
</head>
<body onclick="playVideo()">

  <video id="video-slot" muted playsinline loop></video>

  <div class="footer-bar">
    <div class="ticker-box">
      <div class="ticker-content">
        EASTON PARK RESIDENCE JATINANGOR
      </div>
    </div>
    <div id="clock" class="clock-box">00:00:00</div>
  </div>

<script>
  const v = document.getElementById('video-slot');
  const VIDEO_URL = "https://github.com/doceprj/tvmedia/raw/refs/heads/main/tvmediaa.mp4";

  function playVideo() {
    if (!v.src) v.src = VIDEO_URL;
    v.play();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  function updateClock() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    const s = String(d.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // --- LOGIKA AUTO REFRESH ---
  let lastModified = "";
  setInterval(() => {
    // Mengecek header file HTML ini sendiri untuk melihat perubahan
    fetch(window.location.href, { method: 'HEAD', cache: 'no-cache' })
      .then(res => {
        const current = res.headers.get("Last-Modified") || res.headers.get("ETag");
        if (lastModified && current !== lastModified) {
          console.log("Perubahan terdeteksi, refreshing...");
          location.reload(true); // Force reload
        }
        lastModified = current;
      })
      .catch(err => console.log("Cek update gagal:", err));
  }, 10000); // Cek setiap 10 detik

  window.onload = () => { 
    v.src = VIDEO_URL; 
    v.play().catch(() => {
      console.log("Klik layar untuk memulai video (kebijakan browser)");
    }); 
  };
</script>
</body>
</html>
