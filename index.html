<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easton Park - Rounded Lite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: sans-serif; }

    #video-slot {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
    }

    /* Container utama dengan padding agar tidak menempel ke pinggir */
    .footer-bar {
      position: fixed;
      bottom: 15px; 
      left: 15px; 
      right: 15px;
      height: 50px;
      display: flex;
      gap: 10px; /* Jarak antara teks dan jam */
    }

    /* Frame Running Text Rounded */
    .ticker-box {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      background: #000; /* Warna solid */
      border-radius: 25px; /* Membuat lonjong/rounded */
      border: 2px solid #7FFFD4;
    }

    .ticker-content {
      white-space: nowrap;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      will-change: transform;
      animation: move-text 15s linear infinite;
    }

    @keyframes move-text {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Frame Jam Rounded */
    .clock-box {
      background: #7FFFD4; 
      color: #000;
      padding: 0 25px;
      display: flex;
      align-items: center;
      font-family: monospace;
      font-weight: bold;
      font-size: 20px;
      border-radius: 25px; /* Membuat jam ikutan rounded */
      min-width: 130px;
      justify-content: center;
    }
  </style>
</head>
<body onclick="playVideo()">

  <video id="video-slot" muted playsinline loop></video>

  <div class="footer-bar">
    <div class="ticker-box">
      <div class="ticker-content">
        EASTON PARK RESIDENCE JATINANGOR
      </div>
    </div>
    <div id="clock" class="clock-box">00:00:00</div>
  </div>

<script>
  const v = document.getElementById('video-slot');
  const VIDEO_URL = "https://github.com/doceprj/tvmedia/raw/refs/heads/main/tvmediaa.mp4";

  function playVideo() {
    if (!v.src) v.src = VIDEO_URL;
    v.play();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  function updateClock() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    const s = String(d.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  window.onload = () => { v.src = VIDEO_URL; v.play().catch(() => {}); };
</script>
</body>
</html>
