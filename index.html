<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easton Park - Clean & Stable</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }

    #video-slot {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
    }

    /* Container Bar - Lebih Ramping */
    .footer-bar {
      position: fixed; bottom: 20px; left: 20px; right: 20px;
      height: 40px; display: flex; gap: 12px;
    }

    /* Ticker Box - Warna Abu Gelap Solid (Clean) */
    .ticker-box {
      flex: 1; overflow: hidden; display: flex; align-items: center;
      background: #1a1a1a; 
      border-radius: 30px; 
      border: 1px solid #505050;
    }

    .ticker-content {
      white-space: nowrap; 
      color: #ffffff; 
      font-weight: 600; 
      font-size: 16px;
      letter-spacing: 1px;
      will-change: transform;
      /* Dibuat lebih pelan (30 detik) agar ringan & halus */
      animation: move-text 30s linear infinite;
    }

    @keyframes move-text {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    /* Jam Box - Warna Hijau Soft (Clean) */
    .clock-box {
      background: #e0f7fa; /* Hijau pucat bersih */
      color: #006064; /* Font kontras gelap */
      padding: 0 20px;
      display: flex; align-items: center; 
      font-family: 'Courier New', monospace;
      font-weight: 800; font-size: 18px; 
      border-radius: 30px;
      min-width: 120px; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body onclick="playVideo()">

  <video id="video-slot" muted playsinline loop></video>

  <div class="footer-bar">
    <div class="ticker-box">
      <div class="ticker-content">
        EASTON PARK RESIDENCE JATINANGOR
      </div>
    </div>
    <div id="clock" class="clock-box">00:00:00</div>
  </div>

<script>
  const v = document.getElementById('video-slot');
  const VIDEO_URL = "https://github.com/doceprj/tvmedia/raw/refs/heads/main/tvmediaa.mp4";

  function playVideo() {
    if (!v.src) v.src = VIDEO_URL;
    v.play();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  function updateClock() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    const s = String(d.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // --- LOGIKA AUTO REFRESH ANTI-CACHE ---
  let lastUpdate = "";
  setInterval(() => {
    // Menambahkan query string ?t=[random] agar server memberikan data paling baru (Bypass Cache)
    fetch(window.location.href + "?t=" + new Date().getTime(), { 
      method: 'HEAD', 
      cache: 'no-store' 
    })
    .then(res => {
      const etag = res.headers.get("ETag");
      const lastMod = res.headers.get("Last-Modified");
      const current = etag || lastMod;

      if (lastUpdate && current && current !== lastUpdate) {
        console.log("Kodingan baru terdeteksi! Refreshing...");
        window.location.reload(true);
      }
      lastUpdate = current;
    })
    .catch(e => console.log("Cek update tertunda..."));
  }, 10000); // Cek setiap 10 detik

  window.onload = () => { 
    v.src = VIDEO_URL; 
    v.play().catch(() => {}); 
  };
</script>
</body>
</html>
