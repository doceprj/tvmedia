<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easton Park - Unified Auto Refresh</title>
  <style>
    /* Reset & Base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

    #video-slot {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
    }

    /* Layout Responsive menggunakan VH/VW agar sama di TV/HP/Laptop */
    .footer-bar {
      position: fixed; 
      bottom: 4vh; 
      left: 3vw; 
      right: 3vw;
      height: 7.5vh; 
      display: flex; 
      gap: 1.5vw;
    }

    .ticker-box {
      flex: 1; overflow: hidden; display: flex; align-items: center;
      background: #1a1a1a; 
      border-radius: 50px; 
      border: 0.3vh solid #e0f7fa;
    }

    .ticker-content {
      white-space: nowrap; 
      color: #ffffff; 
      font-weight: 700; 
      font-size: 3.5vh; 
      will-change: transform;
      animation: move-text 35s linear infinite;
    }

    @keyframes move-text {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-120%); }
    }

    .clock-box {
      background: #e0f7fa; 
      color: #006064; 
      padding: 0 4vw;
      display: flex; align-items: center; 
      font-family: monospace;
      font-weight: 900; 
      font-size: 4vh; 
      border-radius: 50px;
      min-width: 150px; 
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body onclick="playVideo()">

  <video id="video-slot" muted playsinline loop></video>

  <div class="footer-bar">
    <div class="ticker-box">
      <div class="ticker-content">
        EASTON PARK RESIDENCE JATINANGOR — MODERN LIVING — UNIT READY STOCK!
      </div>
    </div>
    <div id="clock" class="clock-box">00:00:00</div>
  </div>

<script>
  const v = document.getElementById('video-slot');
  const VIDEO_URL = "https://github.com/doceprj/tvmedia/raw/refs/heads/main/tvmediaa.mp4";

  function playVideo() {
    if (!v.src) v.src = VIDEO_URL;
    v.play().catch(e => console.log("Video Play Error:", e));
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  function updateClock() {
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString('id-ID', { hour12: false });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // --- LOGIKA AUTO REFRESH 30 DETIK (SUPPORT ALL DEVICES) ---
  let lastIdentifer = "";
  
  function checkUpdate() {
    // Menambahkan cache buster yang unik setiap kali fetch
    const fetchUrl = window.location.origin + window.location.pathname + "?cb=" + Date.now();
    
    fetch(fetchUrl, { 
      method: 'HEAD', 
      mode: 'cors',
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
    })
    .then(res => {
      // Mengambil identitas unik file (ETag atau Last-Modified)
      const current = res.headers.get("ETag") || res.headers.get("Last-Modified");
      
      if (lastIdentifer && current && current !== lastIdentifer) {
        console.log("Update terdeteksi! Memuat ulang...");
        // Menggunakan replace agar tidak merusak history browser TV
        window.location.replace(window.location.href);
      }
      lastIdentifer = current;
    })
    .catch(err => console.log("Gagal mengecek update (Offline/CORS):", err));
  }

  // Cek setiap 30 detik
  setInterval(checkUpdate, 30000);

  window.onload = () => { 
    v.src = VIDEO_URL; 
    v.play().catch(() => {});
    // Jalankan cek pertama setelah loading selesai
    setTimeout(checkUpdate, 2000);
  };
</script>
</body>
</html>
