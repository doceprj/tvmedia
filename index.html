<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easton Park - Ultra Lite</title>
  <style>
    /* Reset & Base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: sans-serif; }

    /* Video Background */
    #video-slot {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
    }

    /* Container Solid (Tanpa Transparansi) */
    .footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 45px;
      background: #000; /* Hitam Solid */
      display: flex;
      border-top: 2px solid #ed1c24; /* Garis merah aksen agar tetap modern */
    }

    /* Running Text Box */
    .ticker-box {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .ticker-content {
      white-space: nowrap;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      will-change: transform; /* Optimasi Performa */
      animation: move-text 12s linear infinite;
    }

    @keyframes move-text {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    /* Jam Solid */
    .clock-box {
      background: #ed1c24; /* Warna merah solid agar kontras */
      color: #fff;
      padding: 0 20px;
      display: flex;
      align-items: center;
      font-family: monospace;
      font-weight: bold;
      font-size: 20px;
      min-width: 120px;
      justify-content: center;
    }
  </style>
</head>
<body onclick="playVideo()">

  <video id="video-slot" muted playsinline loop></video>

  <div class="footer-bar">
    <div class="ticker-box">
      <div class="ticker-content">
        EASTON PARK RESIDENCE JATINANGOR
      </div>
    </div>
    <div id="clock" class="clock-box">00:00</div>
  </div>

<script>
  const v = document.getElementById('video-slot');
  const VIDEO_URL = "https://github.com/doceprj/tvmedia/raw/refs/heads/main/tvmediaa.mp4";

  function playVideo() {
    if (!v.src) v.src = VIDEO_URL;
    v.play();
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  // Jam Digital Sederhana
  function updateClock() {
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    const s = String(d.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Load awal
  window.onload = () => { v.src = VIDEO_URL; v.play().catch(() => {}); };
</script>
</body>
</html>
