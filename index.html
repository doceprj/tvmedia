<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easton Park - Force Refresh</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

    #video-slot {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -1;
    }

    /* Container Bar Responsive (vh/vw) */
    .footer-bar {
      position: fixed; bottom: 4vh; left: 3vw; right: 3vw;
      height: 7.5vh; display: flex; gap: 1.5vw;
    }

    .ticker-box {
      flex: 1; overflow: hidden; display: flex; align-items: center;
      background: #1a1a1a; border-radius: 50px; border: 0.3vh solid #e0f7fa;
    }

    .ticker-content {
      white-space: nowrap; color: #ffffff; font-weight: 700; font-size: 3.5vh; 
      will-change: transform;
      animation: move-text 35s linear infinite;
    }

    @keyframes move-text {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-120%); }
    }

    .clock-box {
      background: #e0f7fa; color: #006064; padding: 0 4vw;
      display: flex; align-items: center; font-family: monospace;
      font-weight: 900; font-size: 4vh; border-radius: 50px;
      min-width: 160px; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body onclick="playVideo()">

  <video id="video-slot" muted playsinline loop></video>

  <div class="footer-bar">
    <div class="ticker-box">
      <div class="ticker-content">
        EASTON PARK RESIDENCE JATINANGOR
      </div>
    </div>
    <div id="clock" class="clock-box">00:00:00</div>
  </div>

<script>
  const v = document.getElementById('video-slot');
  const VIDEO_URL = "https://github.com/doceprj/tvmedia/raw/refs/heads/main/media.mp4";

  // 1. Fungsi Putar Video
  function playVideo() {
    if (!v.src) v.src = VIDEO_URL;
    v.play().catch(() => {});
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  // 2. Update Jam (1 Detik Sekali)
  function updateClock() {
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString('id-ID', { hour12: false });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 3. LOGIKA PAKSA REFRESH (30 Detik Sekali)
  // Ini akan memaksa browser memuat ulang halaman dengan URL unik
  setTimeout(() => {
    const currentUrl = window.location.href.split('?')[0];
    const forceUrl = currentUrl + "?refresh=" + Date.now();
    console.log("Forcing refresh to bypass TV cache...");
    window.location.replace(forceUrl);
  }, 30000); // 30.000 ms = 30 detik

  // 4. Load Awal
  window.onload = () => { 
    v.src = VIDEO_URL; 
    v.play().catch(() => {
      console.log("Menunggu interaksi user untuk play video");
    });
  };
</script>
</body>
</html>
